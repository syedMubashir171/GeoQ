#  GeoQ -- project definition, dependencies, and tool configuration.
#
#  This single file replaces setup.py, setup.cfg, pytest.ini, ruff.toml,
#  .isort.cfg and mypy.ini. One file to audit, one file to review.
#
#  Install for development (from the repository root):
#      pip install -e ".[dev]"
#  Install everything, as Colab will:
#      pip install -e ".[all]"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# --------------------------------------------------------------------------- #
# Project metadata
# --------------------------------------------------------------------------- #

[project]
name = "geoq"
version = "0.1.0"
description = "Geometry-aware quantum learning on EEG covariance manifolds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mubashir Hussain Shah", email = "syedmubashir171@gmail.com" }
]
keywords = [
    "quantum machine learning",
    "riemannian geometry",
    "SPD manifold",
    "EEG",
    "brain-computer interface",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

#  The base install is deliberately tiny.
#
#  geoq.geometry and geoq.core must remain importable with NumPy and SciPy
#  alone. Three consequences follow, and all three are load-bearing:
#
#    1. The from-scratch Riemannian implementation can be verified against
#       pyRiemann without pyRiemann being a dependency of the thing it checks.
#    2. Colab installs in seconds during early development, when the entire
#       feedback loop is edit-install-test.
#    3. The geometry layer is independently citable and reusable, which is what
#       makes Paper 6's benchmark package viable.
#
#  A quantum library that quietly became a hard dependency of the matrix
#  logarithm would forfeit all three.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]

#  Classical ML, data handling, and the plotting stack.
ml = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

#  EEG loading, preprocessing, and standardised benchmarking.
eeg = [
    "mne>=1.6",
    "pyriemann>=0.6",
    "moabb>=1.1",
]

#  Quantum simulation. Kept separate because these are the heaviest installs
#  and the slowest to resolve; nothing below the models layer needs them.
quantum = [
    "pennylane>=0.35",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

#  Development and quality tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

#  Convenience meta-target for Colab.
all = [
    "geoq[ml,eeg,quantum,dev]",
]

[project.urls]
Repository = "https://github.com/syedMubashir171/GeoQ"

#  Command-line entry point. Defined now so that notebooks never need to know
#  anything beyond a config path; the notebook rule in the project standards
#  depends on this indirection existing.
[project.scripts]
# geoq = "geoq.cli:main"  # enabled once cli.py exists

# --------------------------------------------------------------------------- #
# Packaging
# --------------------------------------------------------------------------- #

#[tool.setuptools.packages.find]
#where = ["src"]

#[tool.setuptools.package-data]
#geoq = ["py.typed"]
# --------------------------------------------------------------------------- #
# Packaging
# --------------------------------------------------------------------------- #

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoq = ["py.typed"]
# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
#  --strict-markers turns a typo in a marker name into an error rather than a
#  silently skipped test, which is how test suites quietly stop protecting you.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: takes more than ~5 seconds (deselect with '-m \"not slow\"')",
    "quantum: requires the quantum extra (pennylane / qiskit)",
    "eeg: requires the eeg extra and may download data",
    "regression: parity checks against an external reference implementation",
]
filterwarnings = [
    #  Warnings become errors. A RuntimeWarning about an invalid value inside a
    #  matrix logarithm is a scientific defect, not background noise, and it
    #  must not scroll past unnoticed during a long run.
    "error",
    "ignore::DeprecationWarning:moabb.*",
    "ignore::DeprecationWarning:mne.*",
]

[tool.coverage.run]
source = ["geoq"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------- #
# Ruff (linting + import sorting + formatting)
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # use pathlib, never os.path
    "NPY",       # NumPy-specific rules, including the legacy-random-seed ban
    "RUF",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "E501",   # line length is the formatter's job, not the linter's
    #  Scientific modules carry numpydoc-style "References" and "Notes"
    #  sections with underlines, which is the convention across NumPy, SciPy
    #  and pyRiemann and the one reviewers expect. Google convention governs
    #  the Args/Returns/Raises blocks, where it is clearer; D416 would demand
    #  a colon that breaks the numpydoc underline.
    "D416",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
#  Test functions document themselves through their names and class docstrings;
#  requiring a docstring on every one of 123 tests produces noise, not clarity.
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "ARG001", "ARG002"]
"**/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["numpy.typing.mypy_plugin"]

#  These libraries ship no type stubs. Silencing them here is the alternative
#  to scattering `# type: ignore` through the scientific code, where it would
#  also mask genuine errors.
[[tool.mypy.overrides]]
module = [
    "pyriemann.*", "moabb.*", "mne.*",
    "pennylane.*", "qiskit.*", "qiskit_aer.*",
    "sklearn.*", "seaborn.*", "statsmodels.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
