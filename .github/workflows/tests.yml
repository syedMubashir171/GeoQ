# Continuous integration for GeoQ.
#
# Three jobs, each defending a property that has already broken at least once
# in this project.
#
#   lint     - style and static checks, once, fast.
#   test     - the suite on Windows and Linux, Python 3.10 and 3.12.
#   bare     - the suite with only NumPy and SciPy installed.
#
# Why the matrix is not optional
# ------------------------------
# Development happens on Windows and experiments run on Colab, which is Linux.
# That split has already produced two classes of bug that no amount of local
# testing would catch: a subprocess call that stripped the environment and
# failed only where the interpreter needs SYSTEMROOT, and a path assertion
# comparing a POSIX string against a WindowsPath. Both passed on the author's
# machine and both were real.
#
# Why the bare job exists
# -----------------------
# The package claims its geometry layer is importable and testable with NumPy
# and SciPy alone -- that is what lets the from-scratch Riemannian code be
# verified against pyRiemann without depending on it. A claim like that decays
# silently: one convenience import of pandas inside a helper and it is false,
# with every test still green because the developer has pandas installed. The
# bare job is the only thing that keeps it true.

name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic Hypothesis behaviour would hide the flakiness the property
  # tests exist to find, so the seed is left random. What is fixed instead is
  # the database directory, so a failing example found in CI is reported in
  # full rather than silently replayed.
  HYPOTHESIS_PROFILE: ci
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: python -m pip install "ruff>=0.4"

      - name: Lint
        run: ruff check src tests scripts

      - name: Check formatting
        run: ruff format --check src tests scripts

      - name: Reject empty or comment-only modules
        # An empty .py file is valid Python and imports without complaint, so
        # nothing fails until another module needs a name from it. This has
        # happened once already; the hook that catches it runs here too, in
        # case someone commits with --no-verify.
        run: python scripts/check_empty_source.py $(git ls-files '*.py')

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the Windows run because Linux failed, or vice versa:
      # when a failure is platform-specific, seeing both outcomes is the
      # diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[ml,dev]"

      - name: Verify the package imports from outside the repository
        # An editable install can succeed while leaving the package
        # unimportable, because .pth files are read only at interpreter
        # startup. Importing from a different working directory is what
        # distinguishes "installed" from "usable".
        working-directory: ${{ runner.temp }}
        run: python -c "import geoq, geoq.geometry.spd; print(geoq.__file__)"

      - name: Run the suite
        run: python -m pytest -q --durations=10

  bare:
    name: bare install (numpy + scipy only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without the ml, eeg or quantum extras
        run: python -m pip install -e ".[dev]"

      - name: Confirm the heavy dependencies really are absent
        # Without this the job could pass because a transitive dependency
        # quietly pulled scikit-learn in, which would make the whole check
        # meaningless while still reporting green.
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [
              name
              for name in ("sklearn", "pandas", "pyriemann", "mne", "moabb")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              sys.exit(
                  f"{present} are installed, so this job is not testing a bare "
                  f"environment. Check whether a base dependency started "
                  f"pulling them in."
              )
          print("bare environment confirmed")
          PY

      - name: Geometry layer must be usable on its own
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import numpy as np
          from geoq.geometry.riemannian import distance_airm, frechet_mean
          from geoq.geometry.spd import random_spd
          rng = np.random.default_rng(0)
          x = random_spd(8, rng=rng, batch=20)
          print("AIRM distance:", float(distance_airm(x[0], x[1])))
          print("Frechet mean is SPD:", frechet_mean(x).shape)
          PY

      - name: Run the suite, expecting skips rather than errors
        # Tests needing an absent extra must skip. An error here means a
        # module imported something it should not, or a test forgot its
        # importorskip guard.
        run: python -m pytest -q -p no:cacheprovider

  regression:
    name: pyRiemann parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the eeg extra
        run: python -m pip install -e ".[ml,eeg,dev]"

      - name: Parity against the reference implementation
        # Separated from the main matrix because pyRiemann is a heavy install
        # and this is the one job that would break on an upstream release
        # rather than on a change here. Seeing that distinction in the job
        # list is worth the extra minute.
        run: python -m pytest -q -m regression
